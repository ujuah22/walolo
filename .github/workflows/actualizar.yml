name: Actualizar lista

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

# Mínimo privilegio: solo escribe contenido; no expone ningún secret
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # Actions fijados por SHA (no por tag) para que nadie cambie lo que corre
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - run: pip install requests==2.34.2  # versión fijada (no "la última")

      - name: Regenerar listas y espejos
        env:
          # La guia se comprueba con el origen como maximo 1 vez cada N horas;
          # si no ha cambiado responde 304 y no descarga ni un byte.
          EPG_INTERVALO_HORAS: "6"
        run: python merge.py

      - name: Commit cambios (listas + espejo de fuentes + espejo de guia)
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add lista.m3u lista-ios.m3u lista-android-pc.m3u upstream
          git add -A epg 2>/dev/null || true
          git commit -m "Actualizacion automatica" || exit 0
          git push
